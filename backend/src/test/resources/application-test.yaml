spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
  quartz:
    auto-startup: true
    jdbc:
      initialize-schema: always
  data:
    redis:
      password: ""

logging:
  structured:
    format:
      console: ecs
  level:
    root: WARN
    org.springframework.test: INFO
    org.springframework.boot.test: WARN
    dev.hishaam.hermes: INFO

app:
  cors:
    allowed-origin: http://localhost:3000

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
